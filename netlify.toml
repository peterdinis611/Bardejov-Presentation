[[headers]]
  for = "/*"
  [headers.values]
    TDM-Reservation = "1"
    TDM-Policy = "https://peterdinis611.github.io/Bardejov-Presentation/tdm-policy.txt"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Robots-Tag = "noai, noimageai"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://api.open-meteo.com; worker-src 'self' blob:; child-src blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/404.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noai, noimageai"

[[headers]]
  for = "/500.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noai, noimageai"
